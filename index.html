<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }

  .panel {
    width: 220px;
    height: 160px;
    background: rgba(60, 60, 60, 0.92);   /* the "gray" */
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    color: #eee;
  }

  /* This strip is what you drag to move the whole overlay */
  .titlebar {
    height: 28px;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 8px;
    -webkit-app-region: drag;   /* makes this region draggable */
    font-size: 12px;
    color: #bbb;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .menu {
    flex: 1;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    -webkit-app-region: no-drag;
  }

  .menu button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #eee;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  .menu button:hover {
    background: rgba(255,255,255,0.15);
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="titlebar">
      <span>Overlay</span>
      <span style="font-size: 10px; color: #888;">Ctrl+Shift+Q closes</span>
    </div>
    <div class="menu">
      <button data-action="action-one">Action 1 (placeholder)</button>
      <button data-action="action-two">Action 2 (placeholder)</button>
      <button data-action="action-three">Action 3 (placeholder)</button>
    </div>
  </div>

  <script>
    document.querySelectorAll('.menu button').forEach((btn) => {
      btn.addEventListener('click', () => {
        window.overlayAPI.triggerAction(btn.dataset.action);
      });
    });
  </script>
</body>
</html>
